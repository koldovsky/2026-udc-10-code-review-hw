# AI-рев'ю pull request-ів для app/.
#
# Лежить у pipeline/, а не в .github/workflows/: у репо курсу не запускається.
# Щоб увімкнути у своєму форку — скопіюйте в .github/workflows/ai-review.yml.
#
# Порядок: tests (детерміновано, обов'язковий check) → ai-review (лише читання, без
# прав на запис) → post-review (лише публікує готовий текст, AI тут не працює).
# AI-рев'ю дорадче: обов'язковим check-ом у branch protection має бути лише `tests`,
# злиття затверджує людина.

name: ai-review

on:
  pull_request:                      # НЕ pull_request_target: код PR не отримує секретів і прав на запис
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}                      # за замовчуванням — нічого; кожен job просить лише своє

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2             # merge-коміт PR і його першого батька (базу)
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Тести app/
        working-directory: app
        run: npm test                # npm-залежностей немає, npm install не потрібен

      - name: Правило 6 — зміна публічного API має запис у CHANGELOG
        run: |
          changed_api=$(git diff HEAD^1 HEAD -- app/src | grep -E '^[+-]export ' || true)
          changelog=$(git diff --name-only HEAD^1 HEAD -- app/CHANGELOG.md)
          if [ -n "$changed_api" ] && [ -z "$changelog" ]; then
            echo "::error::Змінено експорти в app/src, але app/CHANGELOG.md не оновлено:"
            echo "$changed_api"
            exit 1
          fi

      - name: Правило 11 — у коді немає звернень до інструментів чи рев'юерів
        run: |
          # звертання до AI-інструментів АБО прохання до рев'юера — кожне окремо, бо вони
          # можуть стояти в різних рядках коментаря
          re='\b(ai|llm|gpt|claude|copilot)\b.{0,20}\b(reviewers?|assistants?|agents?|tools?)\b'
          re="$re"'|\b(do not|don.t|please)\s+(report|flag|review|comment on)\b'
          re="$re"'|\bignore (all |the )?(previous|prior|above)\b'
          hits=$(git diff HEAD^1 HEAD -- app | grep -E '^\+' | grep -iE "$re" || true)
          if [ -n "$hits" ]; then
            echo "::error::Знайдено текст, звернений до AI чи рев'юерів (правило 11):"
            echo "$hits"
            exit 1
          fi

  ai-review:
    name: ai-review (дорадче)
    needs: tests
    # PR лише з цього ж репо і не чернетки. Для PR із форків секретів немає — job не запускається.
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true          # збій AI не блокує PR
    permissions:
      contents: read                 # без pull-requests: write — AI не може ні коментувати, ні схвалювати
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Підготувати PR для рев'юера (конфіг — з базової гілки)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}   # текст PR — лише через env, не в скрипт
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          git diff HEAD^1 HEAD > "$RUNNER_TEMP/change.diff"
          # Уся робоча тека — стан бази: app/ до змін і довірений конфіг рев'юера
          # (.claude/, docs/review-standard.md, AGENTS.md, CLAUDE.md). Файли, які додав PR
          # (зокрема .claude/settings.json з hooks чи .mcp.json), зникають.
          git checkout -q --detach HEAD^1
          git clean -fdxq
          mkdir -p review-queue/pr-ci
          mv "$RUNNER_TEMP/change.diff" review-queue/pr-ci/change.diff
          printf '# %s\n\n%s\n' "$PR_TITLE" "$PR_BODY" > review-queue/pr-ci/PR.md

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Встановити Claude Code (закріплена версія)
        run: npm install -g @anthropic-ai/claude-code@2.1.295

      - name: AI-рев'ю
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # лише в цьому кроці
          DISABLE_AUTOUPDATER: "1"
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
        run: |
          if [ "$(wc -c < review-queue/pr-ci/change.diff)" -gt 200000 ]; then
            echo "Диф завеликий для AI-рев'ю — потрібне рев'ю людини." > review.md
            exit 0
          fi
          claude -p "/review-pr ci" \
            --model claude-opus-5-5 \
            --allowedTools "Read,Grep,Glob" \
            --disallowedTools "Bash,Edit,Write,NotebookEdit,WebFetch,WebSearch" \
            --max-turns 30 \
            > review.md

      - uses: actions/upload-artifact@v4
        with:
          name: ai-review
          path: review.md
          retention-days: 3

  post-review:
    name: post-review
    needs: ai-review
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write           # лише коментар; код PR тут не checkout-иться і не виконується
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ai-review

      - name: Опублікувати дорадчий коментар
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if grep -qE 'sk-ant-[A-Za-z0-9_-]{10,}' review.md; then
            echo "::error::У виході рев'юера схоже на API-ключ — коментар не публікується."
            exit 1
          fi
          {
            echo "### 🤖 AI-рев'ю (дорадче)"
            echo
            echo "> Автоматичний коментар за \`docs/review-standard.md\`. Не є схваленням: рішення про злиття ухвалює людина."
            echo
            head -c 60000 review.md | sed 's/@/@\xE2\x80\x8B/g'   # без @-згадок і з межею довжини
          } > comment.md
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file comment.md --edit-last \
            || gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file comment.md
